const TS = 256;

/* =====================================================================
   WORLD SHADER: diffuse * (lightmap | baked vertex light) * overbright + dynamic lights + fog
   ===================================================================== */
const DL = { pos: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()], col: [new THREE.Color(0, 0, 0), new THREE.Color(0, 0, 0), new THREE.Color(0, 0, 0)], rad: [8, 8, 8] };
const SU = {
  dlPos: { value: DL.pos }, dlCol: { value: DL.col }, dlRad: { value: DL.rad },
  fogColor: { value: FOG_COLOR }, fogDensity: { value: 0.016 }, overbright: { value: 2.0 }, lm: { value: null }
};
const WVS = `
#ifdef USE_LM
attribute vec2 luv; varying vec2 vLuv;
#else
attribute vec3 vcol; varying vec3 vCol;
#endif
varying vec2 vUv; varying vec3 vW; varying float vFog;
void main(){
  vUv = uv;
#ifdef USE_LM
  vLuv = luv;
#else
  vCol = vcol;
#endif
  vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz;
  vec4 mv = viewMatrix * w; vFog = -mv.z; gl_Position = projectionMatrix * mv;
}`;
const WFS = `
uniform sampler2D map; uniform vec3 tint; uniform vec3 dlPos[3]; uniform vec3 dlCol[3]; uniform float dlRad[3];
uniform vec3 fogColor; uniform float fogDensity; uniform float overbright; uniform float emissive;
#ifdef USE_LM
uniform sampler2D lm; varying vec2 vLuv;
#else
varying vec3 vCol;
#endif
varying vec2 vUv; varying vec3 vW; varying float vFog;
void main(){
  vec4 t = texture2D(map, vUv);
#ifdef ALPHATEST
  if (t.a < 0.5) discard;
#endif
#ifdef USE_LM
  vec3 L = texture2D(lm, vLuv).rgb * overbright;
#else
  vec3 L = vCol;
#endif
  for (int i = 0; i < 3; i++) { float a = max(0.0, 1.0 - distance(vW, dlPos[i]) / dlRad[i]); L += dlCol[i] * a * a; }
  L = max(L, vec3(emissive));
  vec3 c = t.rgb * tint * L;
  float f = clamp(1.0 - exp(-fogDensity * fogDensity * vFog * vFog), 0.0, 1.0);
  gl_FragColor = vec4(mix(c, fogColor, f), t.a);
}`;
function worldMat(map, { lm = false, alpha = false, tint = [1, 1, 1], side = THREE.FrontSide, emissive = 0 } = {}) {
  const defines = {}; if (lm) defines.USE_LM = 1; if (alpha) defines.ALPHATEST = 1;
  return new THREE.ShaderMaterial({
    uniforms: { map: { value: map }, tint: { value: new THREE.Color(...tint) }, emissive: { value: emissive }, dlPos: SU.dlPos, dlCol: SU.dlCol, dlRad: SU.dlRad, fogColor: SU.fogColor, fogDensity: SU.fogDensity, overbright: SU.overbright, lm: SU.lm },
    vertexShader: WVS, fragmentShader: WFS, defines, side
  });
}
